[package]
name = "ynab-mcp-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "MCP server for YNAB: read-only by construction, journaled two-phase undo for the one write tool, no telemetry"
license = "MIT"
repository = "https://github.com/mattCasanova/ynab-mcp-server"
homepage = "https://github.com/mattCasanova/ynab-mcp-server"
readme = "README.md"
keywords = ["ynab", "mcp", "budget", "claude", "finance"]
categories = ["command-line-utilities", "finance"]
exclude = [".github/", "*.jsonl"]

# The crate is ynab-mcp-server on crates.io (ynab-mcp was already taken); the binary stays ynab-mcp.
[[bin]]
name = "ynab-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.3", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
# rustls with the ring provider: no cmake/NASM at build time, so CI can build all three OSes natively.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std"] }
toml = "1"
pdf = "0.9"
rpassword = "7"

[profile.release]
lto = true
codegen-units = 1
strip = true
