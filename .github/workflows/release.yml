name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       target: aarch64-apple-darwin,       archive: tar.gz }
          - { os: macos-14,       target: x86_64-apple-darwin,        archive: tar.gz }
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-musl,  archive: tar.gz }
          - { os: ubuntu-22.04,   target: aarch64-unknown-linux-musl, archive: tar.gz, cross: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     archive: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'linux-musl') && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: cross (aarch64 linux)
        if: matrix.cross
        run: cargo install cross --locked
      - name: build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="ynab-mcp-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/ynab-mcp.exe" "dist/${name}/"
          else
            cp "target/${{ matrix.target }}/release/ynab-mcp" "dist/${name}/"
          fi
          cp README.md LICENSE "dist/${name}/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "${name}.zip" "${name}" >/dev/null
            sha256sum "${name}.zip" > "${name}.zip.sha256"
          else
            tar czf "${name}.tar.gz" "${name}"
            if command -v sha256sum >/dev/null; then sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"; else shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"; fi
          fi
          rm -r "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && cat *.sha256 > SHA256SUMS && ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
